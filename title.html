<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridGuide · Team TCC</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap');
      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{display:grid;place-items:center;background:#0a0d12;font-family:'DM Sans',system-ui,sans-serif;color:#fff;overflow:hidden}
      /* 16:9 stage that scales to any window; 1920x1080 at 100% */
      .stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;font-size:calc(min(100vw,177.78vh) / 1920 * 16);
        background:linear-gradient(135deg,#1976f0 0%,#1562cf 20%,#0f4a9e 42%,#0a2d59 66%,#0a0d12 100%)}
      .grid{position:absolute;inset:0;width:100%;height:100%}
      .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9.5em}
      .logo{display:flex;align-items:center;gap:1.4em;margin-bottom:2.2em}
      .bolt{display:grid;place-items:center;width:5.6em;height:5.6em;border-radius:1.5em;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 1em 3em rgba(37,99,235,.55)}
      .bolt svg{width:3.2em;height:3.2em}
      h1{margin:0;font:800 9.6em/1 Manrope,sans-serif;letter-spacing:-.02em}
      h1 span{background:linear-gradient(90deg,#fff,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
      .tag{margin:.9em 0 0;font-size:2.3em;font-weight:500;color:#bcd0f5;max-width:26em;line-height:1.35}
      .rule{width:9em;height:.35em;border-radius:1em;background:linear-gradient(90deg,#facc15,#f97316);margin:3.2em 0 2.4em}
      .team{display:flex;align-items:baseline;gap:1em;font-size:2.1em}
      .team small{font:600 .62em 'DM Sans';letter-spacing:.22em;text-transform:uppercase;color:#7f95c4}
      .team b{font:800 1.6em Manrope,sans-serif;letter-spacing:.04em;color:#facc15}
      .members{display:flex;gap:3.4em;margin-top:1.1em;font-size:2.1em;font-weight:500;color:#e6edfb}
      .members span{position:relative;padding-left:1.1em}
      .members span::before{content:'';position:absolute;left:0;top:.5em;width:.5em;height:.5em;border-radius:50%;background:#60a5fa}
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="#4aa3ff" stroke-opacity=".4" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M1180 140 L1420 140 L1420 330 L1700 330"/><path d="M1420 330 L1420 560 L1840 560"/>
          <path d="M1560 140 L1560 40"/><path d="M1700 330 L1700 220 L1880 220"/><path d="M1420 560 L1420 760 L1640 760 L1640 960"/>
          <path d="M1840 560 L1840 700"/><path d="M1180 140 L1180 80"/><path d="M1420 760 L1260 760 L1260 900"/>
        </g>
        <g fill="#0a2d59" stroke="#9fd0ff" stroke-width="3">
          <circle cx="1180" cy="140" r="9"/><circle cx="1420" cy="140" r="9"/><circle cx="1420" cy="330" r="9"/><circle cx="1700" cy="330" r="9"/>
          <circle cx="1420" cy="560" r="9"/><circle cx="1840" cy="560" r="9"/><circle cx="1420" cy="760" r="9"/><circle cx="1640" cy="760" r="9"/><circle cx="1260" cy="900" r="9"/>
        </g>
        <g fill="#facc15" stroke="#fff" stroke-width="3"><rect x="1550" y="130" width="20" height="20" rx="4"/><path d="M1636 760 l14 -22 l14 22z" transform="translate(-14 12)"/></g>
        <circle cx="1700" cy="220" r="26" fill="none" stroke="#ef4444" stroke-opacity=".6" stroke-width="3"/>
        <circle cx="1700" cy="220" r="11" fill="#ef4444" stroke="#fff" stroke-width="3"/>
        <circle cx="1840" cy="700" r="11" fill="#60a5fa" stroke="#fff" stroke-width="3"/>
      </svg>
      <div class="content">
        <div class="logo">
          <div class="bolt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 2 4 14h6l-1.5 8L20 9.5h-6.5z"/></svg></div>
        </div>
        <h1><span>GridGuide</span></h1>
        <p class="tag">Outage intelligence for crews and customers</p>
        <div class="rule"></div>
        <div class="team"><small>Team</small><b>TCC</b></div>
        <div class="members"><span>Avaneesh Kad</span><span>Dylan Levy</span><span>Cavan Moriarty</span></div>
      </div>
    </div>
  </body>
</html>
